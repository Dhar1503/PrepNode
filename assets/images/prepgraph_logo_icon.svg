<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PrepGraph app icon">
  <title>PrepGraph app icon</title>
  <!--
    Square / full-bleed variant: three nodes joined into a closed triangle
    on the app's ink ground. Opaque by design — Play Store icons are
    rejected if they carry an alpha channel.

      ground   ink900   #1B2A4A
      top node paper50  #FBFAF6
      left     sage500  #5C8A72
      right    marigold #E5A73B
      edges    a muted steel blue that reads against the ink ground
  -->
  <rect width="512" height="512" fill="#1B2A4A"/>
  <g stroke="#6E82AB" stroke-width="20" stroke-linecap="round" fill="none">
    <line x1="256" y1="150" x2="155" y2="318"/>
    <line x1="256" y1="150" x2="357" y2="318"/>
    <line x1="155" y1="318" x2="357" y2="318"/>
  </g>
  <circle cx="256" cy="150" r="52" fill="#FBFAF6"/>
  <circle cx="155" cy="318" r="46" fill="#5C8A72"/>
  <circle cx="357" cy="318" r="46" fill="#E5A73B"/>
</svg>
